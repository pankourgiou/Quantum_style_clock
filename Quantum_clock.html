<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quantum Equation Clock</title>
<title>setting A=B=C=D=E=F=G=H=I=J=K=L=1 we have:</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #01030a, #000 80%);
    font-family: "Orbitron", sans-serif;
    overflow: hidden;
  }

  .container {
    position: relative;
  }

  .title {
    position: absolute;
    top: -70px;
    width: 100%;
    text-align: center;
    font-size: 20px;
    color: #00ffff;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #00ffff;
  }

  canvas {
    filter: drop-shadow(0 0 25px #00ffff);
  }

  .energy {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(0,255,255,0.15), transparent 70%);
    animation: pulse 3s infinite;
  }

  @keyframes pulse {
    0%,100% {opacity: 0.4;}
    50% {opacity: 1;}
  }
</style>
</head>

<body>
<div class="container">
  <div class="title">⚛ QUANTUM FIELD CLOCK ⚛</div>
  <div class="title" style="top:-110px; font-size:16px;">Setting A = B = C = D = E = F = G = H = I = J = K = L = 1 we have:</div>
  <div class="energy"></div>
  <canvas id="clock" width="520" height="520"></canvas>
</div>

<script>
const canvas = document.getElementById("clock");
const ctx = canvas.getContext("2d");

const center = canvas.width / 2;
const radius = 200;

const labels = [
  "A = E/mc mod 2", "B = E/mc mod 2", "C = E/mc mod 2", "D = E/mc mod 2",
  "E = E/mc mod 2", "F = E/mc mod 2", "G = E/mc mod 2", "H = E/mc mod 2",
  "I = E/mc mod 2", "J = E/mc mod 2", "K = E/mc mod 2", "L = E/mc mod 2"
];

function drawClock() {
  const now = new Date();

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(center, center);

  // outer quantum ring
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "#00ffff";
  ctx.lineWidth = 3;
  ctx.shadowBlur = 30;
  ctx.shadowColor = "#00ffff";
  ctx.stroke();

  // ticks
  for (let i = 0; i < 60; i++) {
    const angle = (Math.PI / 30) * i;
    const r1 = radius - 12;
    const r2 = i % 5 === 0 ? radius - 28 : radius - 18;

    ctx.beginPath();
    ctx.moveTo(r1 * Math.cos(angle), r1 * Math.sin(angle));
    ctx.lineTo(r2 * Math.cos(angle), r2 * Math.sin(angle));
    ctx.strokeStyle = "#00ffee";
    ctx.lineWidth = i % 5 === 0 ? 2 : 1;
    ctx.stroke();
  }

  // labels
  ctx.font = "12px Orbitron";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI / 6) * i - Math.PI / 2;
    const x = (radius - 55) * Math.cos(angle);
    const y = (radius - 55) * Math.sin(angle);

    ctx.fillStyle = "#00ffff";
    ctx.shadowBlur = 15;
    ctx.fillText(labels[i], x, y);
  }

  const hour = now.getHours() % 12 + now.getMinutes() / 60;
  const minute = now.getMinutes();
  const second = now.getSeconds();

  // hour
  let angle = (Math.PI / 6) * hour - Math.PI / 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(90 * Math.cos(angle), 90 * Math.sin(angle));
  ctx.strokeStyle = "gold";
  ctx.lineWidth = 6;
  ctx.shadowColor = "gold";
  ctx.shadowBlur = 25;
  ctx.stroke();

  // minute
  angle = (Math.PI / 30) * minute - Math.PI / 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(135 * Math.cos(angle), 135 * Math.sin(angle));
  ctx.strokeStyle = "white";
  ctx.lineWidth = 3;
  ctx.shadowColor = "white";
  ctx.shadowBlur = 20;
  ctx.stroke();

  // second
  angle = (Math.PI / 30) * second - Math.PI / 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(165 * Math.cos(angle), 165 * Math.sin(angle));
  ctx.strokeStyle = "#ff0066";
  ctx.lineWidth = 2;
  ctx.shadowColor = "#ff0066";
  ctx.shadowBlur = 20;
  ctx.stroke();

  // core
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI * 2);
  ctx.fillStyle = "white";
  ctx.fill();

  ctx.restore();
}

setInterval(drawClock, 1000);
drawClock();
</script>

</body>
</html>
